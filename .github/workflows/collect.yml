name: 데이터 수집·제보 반영·배포
on:
  schedule:
    - cron: "30 19 * * *"          # 매일 04:30 KST — 경기데이터드림 3종 API 재수집
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]   # 제보가 바뀌면 즉시 지도 반영
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency: { group: build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas numpy scipy
      - name: 경기데이터드림 API 수집 (스케줄·수동 실행 때만)
        if: github.event_name != 'issues'
        env:
          GG_API_KEY: ${{ secrets.GG_API_KEY }}
        run: python collect_gg.py
      - name: 취약지점 계산 → docs/data/data.js (스케줄·수동 실행 때만)
        if: github.event_name != 'issues'
        run: python build_site.py
      - name: 제보 이슈 → docs/data/reports.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python fetch_reports.py
      - name: 커밋·푸시
        run: |
          git config user.name "petrol-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M') 갱신"
          git push
